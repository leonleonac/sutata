<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regression MVP</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap");

      :root {
        --bg-a: #f5f7f9;
        --bg-b: #e8edf2;
        --ink: #14212b;
        --muted: #4f6473;
        --card: #ffffffd9;
        --line: #d7e0e8;
        --brand: #116149;
        --brand-2: #0e7f5f;
        --danger: #b2452f;
        --preview-h: 220px;
        --coef-h: 280px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 700px at 100% 0%, #dbe9dd 0%, transparent 70%),
          linear-gradient(160deg, var(--bg-a), var(--bg-b));
        min-height: 100vh;
      }

      .shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 18px 40px;
      }

      .hero {
        animation: rise 0.6s ease-out both;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4.4vw, 48px);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(320px, 1.05fr) 12px minmax(320px, 1fr);
        gap: 0;
        align-items: stretch;
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        backdrop-filter: blur(6px);
        animation: rise 0.55s ease-out both;
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      label {
        font-size: 13px;
        color: var(--muted);
      }

      input[type="file"],
      select,
      input[type="text"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
        background: white;
        color: var(--ink);
      }

      select[multiple] {
        min-height: 88px;
      }

      button {
        border: none;
        border-radius: 11px;
        padding: 9px 14px;
        font-weight: 700;
        letter-spacing: 0.01em;
        font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }

      button:active {
        transform: translateY(1px);
      }

      .btn-main {
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        color: #fff;
      }

      .btn-ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
      }

      .mono {
        font-family: "IBM Plex Mono", Consolas, monospace;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-top: 10px;
      }

      .preview-wrap {
        height: var(--preview-h);
        min-height: 120px;
      }

      .coef-wrap {
        height: var(--coef-h);
        min-height: 140px;
      }

      .panel-divider {
        width: 12px;
        margin: 0 2px;
        border-radius: 10px;
        background: linear-gradient(180deg, #d6e2ec, #c6d7e4);
        cursor: col-resize;
        position: relative;
      }

      .panel-divider::before {
        content: "";
        position: absolute;
        left: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 2px;
        height: 44px;
        background: #9db3c5;
        border-radius: 2px;
        box-shadow: 0 -8px 0 #9db3c5, 0 8px 0 #9db3c5;
      }

      .resize-handle {
        height: 11px;
        border-radius: 8px;
        margin-top: 8px;
        background: linear-gradient(90deg, #dbe5ee, #c9d8e5);
        cursor: row-resize;
      }

      .resize-handle:hover,
      .panel-divider:hover {
        filter: brightness(0.96);
      }

      .collapsed {
        display: none !important;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 560px;
      }

      th,
      td {
        border-bottom: 1px solid #edf2f7;
        padding: 8px 9px;
        font-size: 12px;
        text-align: left;
      }

      th {
        position: sticky;
        top: 0;
        background: #f7fbf8;
      }

      .list {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      .warn {
        color: var(--danger);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .summary div {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        padding: 8px;
      }

      .summary p {
        margin: 0;
      }

      .summary .k {
        font-size: 11px;
        color: var(--muted);
      }

      .summary .v {
        font-size: 14px;
        font-weight: 700;
      }

      .result-layout {
        display: grid;
        grid-template-columns: minmax(230px, 290px) minmax(0, 1fr);
        gap: 12px;
        margin-top: 8px;
      }

      .group-panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f9fcff;
        padding: 10px;
      }

      .group-panel h3 {
        margin: 0;
        font-size: 14px;
      }

      .group-list {
        margin-top: 8px;
        max-height: 520px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .group-item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        background: #fff;
      }

      .group-item.active {
        border-color: #8ab6a7;
        box-shadow: inset 0 0 0 1px #8ab6a744;
      }

      .group-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
        align-items: center;
      }

      .group-select {
        text-align: left;
        background: transparent;
        border: none;
        padding: 0;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
      }

      .group-close {
        border: 1px solid #e2c5c0;
        background: #fff6f4;
        color: var(--danger);
        border-radius: 8px;
        width: 24px;
        height: 24px;
        padding: 0;
        font-weight: 700;
        line-height: 1;
      }

      .group-meta {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 11px;
      }

      .result-panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 10px;
      }

      .empty-note {
        color: var(--muted);
        font-size: 13px;
        margin: 8px 0 0;
      }

      @media (max-width: 700px) {
        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 980px) {
        .result-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 980px) {
        .panel-divider,
        .resize-handle {
          display: none !important;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <h1>Regression Workbench</h1>
        <p class="sub">
          Upload dataset, choose Y/X/C, run OLS, and export result as CSV or Markdown.
        </p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>1) Dataset</h2>
          <input id="file" type="file" />
          <div class="row" style="margin-top: 10px">
            <button id="uploadBtn" class="btn-main">Upload</button>
            <span id="datasetId" class="mono"></span>
          </div>
          <p id="schemaTxt" class="status"></p>
          <div class="row">
            <button id="togglePreviewBtn" class="btn-ghost" disabled>Hide Preview</button>
            <span class="status" style="margin-top: 0">Drag handle to resize panel.</span>
          </div>
          <div id="preview" class="table-wrap preview-wrap" style="display: none"></div>
          <div id="previewResize" class="resize-handle collapsed" title="Drag to resize"></div>
        </article>

        <div id="mainDivider" class="panel-divider" title="Drag to resize left and right panels"></div>

        <article class="card">
          <h2>2) Model</h2>
          <label>Y (single)</label>
          <select id="ySelect"></select>
          <label style="margin-top: 8px; display: block">X (multiple)</label>
          <select id="xSelect" multiple></select>
          <label style="margin-top: 8px; display: block">C (multiple)</label>
          <select id="cSelect" multiple></select>

          <div class="row" style="margin-top: 10px">
            <label><input id="intercept" type="checkbox" checked /> Intercept</label>
            <label>Robust SE</label>
            <select id="robust" style="width: 120px">
              <option value="none">none</option>
              <option value="HC1">HC1</option>
            </select>
          </div>

          <label style="margin-top: 8px; display: block">log1p cols (comma separated)</label>
          <input id="logCols" type="text" placeholder="x1,x2" />
          <label style="margin-top: 8px; display: block">z-score cols (comma separated)</label>
          <input id="zCols" type="text" placeholder="x1" />
          <label style="margin-top: 8px; display: block">Group title (optional)</label>
          <input id="groupTitle" type="text" placeholder="e.g. Baseline / Robustness A" />

          <div class="row" style="margin-top: 10px">
            <button id="runBtn" class="btn-main">Run + Save Group</button>
            <button id="csvBtn" class="btn-ghost" disabled>CSV</button>
            <button id="mdBtn" class="btn-ghost" disabled>Markdown</button>
          </div>
          <p id="runStatus" class="status"></p>
        </article>
      </section>

      <section class="card" style="margin-top: 14px">
        <h2>3) Result</h2>
        <div class="result-layout">
          <aside class="group-panel">
            <div class="row" style="justify-content: space-between; align-items: center">
              <h3>Regression Groups</h3>
              <button id="refreshGroupsBtn" class="btn-ghost">Refresh</button>
            </div>
            <div id="groupList" class="group-list"></div>
          </aside>

          <div class="result-panel">
            <div id="summary" class="summary"></div>
            <p id="emptyResultNote" class="empty-note">No group selected.</p>
            <ul id="warnings" class="list warn"></ul>
            <div id="coef" class="table-wrap coef-wrap" style="margin-top: 10px; display: none"></div>
            <div id="coefResize" class="resize-handle collapsed" title="Drag to resize"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const state = {
        datasetId: null,
        modelId: null,
        activeGroupId: null,
        columns: [],
        groups: [],
        modelCache: {},
        previewCollapsed: false,
      };

      const $ = (id) => document.getElementById(id);

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function toFixedSafe(value) {
        if (value === null || value === undefined || value === "") return "";
        const n = Number(value);
        return Number.isFinite(n) ? n.toFixed(6) : String(value);
      }

      function parseCommaList(text) {
        return text
          .split(",")
          .map((v) => v.trim())
          .filter(Boolean);
      }

      async function parseApiResponse(res) {
        const ctype = res.headers.get("content-type") || "";
        const text = await res.text();
        if (ctype.includes("application/json")) {
          try {
            return { data: JSON.parse(text), raw: text };
          } catch (_) {
            return { data: null, raw: text };
          }
        }
        try {
          return { data: JSON.parse(text), raw: text };
        } catch (_) {
          return { data: null, raw: text };
        }
      }

      function renderTable(hostId, rows) {
        if (!rows || rows.length === 0) {
          $(hostId).style.display = "none";
          $(hostId).innerHTML = "";
          return;
        }
        const keys = Object.keys(rows[0]);
        const head = `<tr>${keys.map((k) => `<th>${escapeHtml(k)}</th>`).join("")}</tr>`;
        const body = rows
          .map(
            (row) =>
              `<tr>${keys.map((k) => `<td>${escapeHtml(row[k] ?? "")}</td>`).join("")}</tr>`
          )
          .join("");
        $(hostId).innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
        $(hostId).style.display = "block";
      }

      function renderVariableOptions(columns) {
        const options = columns
          .map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)
          .join("");
        $("ySelect").innerHTML = options;
        $("xSelect").innerHTML = options;
        $("cSelect").innerHTML = options;
      }

      function renderSummary(summary) {
        const pairs = [
          ["R²", summary.r_squared],
          ["Adj.R²", summary.adj_r_squared],
          ["F", summary.f_stat],
          ["Prob(F)", summary.prob_f],
          ["N", summary.n],
        ];
        $("summary").innerHTML = pairs
          .map(([k, v]) => `<div><p class="k">${k}</p><p class="v mono">${toFixedSafe(v)}</p></div>`)
          .join("");
      }

      function getSelectedValues(selectId) {
        const sel = $(selectId);
        return Array.from(sel.selectedOptions).map((o) => o.value);
      }

      function clearResultView(note = "No group selected.") {
        $("summary").innerHTML = "";
        $("warnings").innerHTML = "";
        $("coef").style.display = "none";
        $("coef").innerHTML = "";
        $("coefResize").classList.add("collapsed");
        $("emptyResultNote").textContent = note;
        $("emptyResultNote").classList.remove("collapsed");
        $("csvBtn").disabled = true;
        $("mdBtn").disabled = true;
        state.modelId = null;
      }

      function renderResultView(result) {
        state.modelId = result.model_id;
        $("emptyResultNote").classList.add("collapsed");
        renderSummary(result.summary || {});
        renderTable("coef", result.coefficients || []);
        $("coefResize").classList.toggle("collapsed", !(result.coefficients || []).length);
        $("warnings").innerHTML = (result.warnings || [])
          .map((w) => `<li>${escapeHtml(w)}</li>`)
          .join("");
        $("csvBtn").disabled = false;
        $("mdBtn").disabled = false;
      }

      function renderGroupList() {
        const host = $("groupList");
        if (!state.datasetId) {
          host.innerHTML = `<p class="group-meta">Upload dataset first.</p>`;
          return;
        }
        if (!state.groups.length) {
          host.innerHTML = `<p class="group-meta">No groups yet. Run model to create one.</p>`;
          return;
        }
        host.innerHTML = state.groups
          .map((group) => {
            const payload = group.payload || {};
            const x = (payload.x_cols || []).join(", ") || "-";
            const c = (payload.c_cols || []).join(", ") || "-";
            const y = payload.y_col || "-";
            const s = group.summary || {};
            const active = state.activeGroupId === group.group_id ? "active" : "";
            return `
              <div class="group-item ${active}">
                <div class="group-top">
                  <button class="group-select" data-select-group="${escapeHtml(group.group_id)}">
                    ${escapeHtml(group.title)}
                  </button>
                  <button class="group-close" data-close-group="${escapeHtml(group.group_id)}" title="Close group">×</button>
                </div>
                <p class="group-meta mono">R²=${toFixedSafe(s.r_squared)} | N=${toFixedSafe(s.n)}</p>
                <p class="group-meta">Y:${escapeHtml(y)} | X:${escapeHtml(x)} | C:${escapeHtml(c)}</p>
              </div>
            `;
          })
          .join("");
      }

      async function fetchModelResult(modelId) {
        if (state.modelCache[modelId]) return state.modelCache[modelId];
        const res = await fetch(`/api/models/${modelId}`);
        const { data, raw } = await parseApiResponse(res);
        if (!res.ok) throw new Error((data && data.detail) || raw || "load model failed");
        state.modelCache[modelId] = data;
        return data;
      }

      async function activateGroup(groupId) {
        const group = state.groups.find((g) => g.group_id === groupId);
        if (!group) return;
        state.activeGroupId = groupId;
        renderGroupList();
        $("runStatus").textContent = `Loading ${group.title}...`;
        try {
          const result = await fetchModelResult(group.model_id);
          renderResultView(result);
          $("runStatus").textContent = `Viewing ${group.title}`;
        } catch (err) {
          $("runStatus").textContent = `Load group error: ${err.message}`;
        }
      }

      async function loadGroups(preferGroupId = null) {
        if (!state.datasetId) {
          state.groups = [];
          state.activeGroupId = null;
          renderGroupList();
          clearResultView("No dataset loaded.");
          return;
        }
        const res = await fetch(`/api/datasets/${state.datasetId}/groups`);
        const { data, raw } = await parseApiResponse(res);
        if (!res.ok) throw new Error((data && data.detail) || raw || "load groups failed");
        state.groups = data.groups || [];
        renderGroupList();

        const targetId =
          (preferGroupId && state.groups.find((g) => g.group_id === preferGroupId) && preferGroupId) ||
          (state.activeGroupId && state.groups.find((g) => g.group_id === state.activeGroupId) && state.activeGroupId) ||
          (state.groups[0] && state.groups[0].group_id) ||
          null;

        if (!targetId) {
          state.activeGroupId = null;
          clearResultView("No groups available. Create one with Run + Save Group.");
          return;
        }
        await activateGroup(targetId);
      }

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function initMainDivider() {
        const divider = $("mainDivider");
        const grid = document.querySelector(".grid");
        if (!divider || !grid) return;

        divider.addEventListener("pointerdown", (ev) => {
          if (window.innerWidth <= 980) return;
          ev.preventDefault();
          const rect = grid.getBoundingClientRect();
          divider.setPointerCapture(ev.pointerId);

          const move = (e) => {
            const left = clamp(e.clientX - rect.left, 300, rect.width - 320);
            grid.style.gridTemplateColumns = `${left}px 12px minmax(320px, 1fr)`;
          };
          const up = () => {
            divider.removeEventListener("pointermove", move);
            divider.removeEventListener("pointerup", up);
          };
          divider.addEventListener("pointermove", move);
          divider.addEventListener("pointerup", up);
        });
      }

      function initVerticalResize(handleId, hostId, minHeight = 120, maxHeight = 700) {
        const handle = $(handleId);
        const host = $(hostId);
        if (!handle || !host) return;

        handle.addEventListener("pointerdown", (ev) => {
          if (host.classList.contains("collapsed") || host.style.display === "none") return;
          ev.preventDefault();

          const startY = ev.clientY;
          const startH = host.getBoundingClientRect().height;
          handle.setPointerCapture(ev.pointerId);

          const move = (e) => {
            const delta = e.clientY - startY;
            const next = clamp(startH + delta, minHeight, maxHeight);
            host.style.height = `${next}px`;
          };
          const up = () => {
            handle.removeEventListener("pointermove", move);
            handle.removeEventListener("pointerup", up);
          };
          handle.addEventListener("pointermove", move);
          handle.addEventListener("pointerup", up);
        });
      }

      function syncPreviewVisibility() {
        const preview = $("preview");
        const resize = $("previewResize");
        const toggle = $("togglePreviewBtn");
        const hasData = preview.innerHTML.trim().length > 0;
        toggle.disabled = !hasData;

        if (!hasData) {
          preview.style.display = "none";
          resize.classList.add("collapsed");
          toggle.textContent = "Hide Preview";
          return;
        }
        if (state.previewCollapsed) {
          preview.classList.add("collapsed");
          resize.classList.add("collapsed");
          toggle.textContent = "Show Preview";
        } else {
          preview.classList.remove("collapsed");
          preview.style.display = "block";
          resize.classList.remove("collapsed");
          toggle.textContent = "Hide Preview";
        }
      }

      initMainDivider();
      initVerticalResize("previewResize", "preview", 120, 680);
      initVerticalResize("coefResize", "coef", 140, 760);
      renderGroupList();
      clearResultView("Upload dataset and create your first group.");

      $("togglePreviewBtn").addEventListener("click", () => {
        state.previewCollapsed = !state.previewCollapsed;
        syncPreviewVisibility();
      });

      $("uploadBtn").addEventListener("click", async () => {
        const file = $("file").files[0];
        if (!file) {
          $("runStatus").textContent = "Please choose a file first.";
          return;
        }

        const form = new FormData();
        form.append("file", file);
        $("runStatus").textContent = "Uploading...";
        try {
          const res = await fetch("/api/datasets/upload", { method: "POST", body: form });
          const { data, raw } = await parseApiResponse(res);
          if (!res.ok) throw new Error((data && data.detail) || raw || "upload failed");

          state.datasetId = data.dataset_id;
          state.modelCache = {};
          state.groups = [];
          state.activeGroupId = null;
          state.columns = (data.schema.columns || []).map((c) => c.name);
          $("datasetId").textContent = data.dataset_id;
          $("schemaTxt").textContent = `${data.schema.row_count} rows, ${data.schema.column_count} columns`;
          renderVariableOptions(state.columns);
          renderTable("preview", data.preview || []);
          state.previewCollapsed = false;
          syncPreviewVisibility();
          await loadGroups();
          $("runStatus").textContent = "Dataset uploaded.";
        } catch (err) {
          $("runStatus").textContent = `Upload error: ${err.message}`;
        }
      });

      $("runBtn").addEventListener("click", async () => {
        if (!state.datasetId) {
          $("runStatus").textContent = "Upload dataset first.";
          return;
        }
        const y = $("ySelect").value;
        const x = getSelectedValues("xSelect");
        const c = getSelectedValues("cSelect");
        const payload = {
          dataset_id: state.datasetId,
          y_col: y,
          x_cols: x,
          c_cols: c,
          group_title: $("groupTitle").value.trim() || undefined,
          fit_options: {
            intercept: $("intercept").checked,
            robust_se: $("robust").value,
          },
          preprocess: {
            log1p_cols: parseCommaList($("logCols").value),
            zscore_cols: parseCommaList($("zCols").value),
          },
        };

        $("runStatus").textContent = "Running model...";
        try {
          const res = await fetch("/api/groups/create-and-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const { data, raw } = await parseApiResponse(res);
          if (!res.ok) throw new Error((data && data.detail) || raw || "run failed");

          if (data.result && data.result.model_id) {
            state.modelCache[data.result.model_id] = data.result;
          }
          await loadGroups(data.group_id);
          $("runStatus").textContent = `Done. group=${data.title}`;
        } catch (err) {
          $("runStatus").textContent = `Run error: ${err.message}`;
        }
      });

      $("refreshGroupsBtn").addEventListener("click", async () => {
        try {
          await loadGroups();
          $("runStatus").textContent = "Groups refreshed.";
        } catch (err) {
          $("runStatus").textContent = `Refresh error: ${err.message}`;
        }
      });

      $("groupList").addEventListener("click", async (event) => {
        const closeBtn = event.target.closest("[data-close-group]");
        if (closeBtn) {
          const groupId = closeBtn.getAttribute("data-close-group");
          if (!groupId) return;
          try {
            const res = await fetch(`/api/groups/${groupId}`, { method: "DELETE" });
            const { data, raw } = await parseApiResponse(res);
            if (!res.ok) throw new Error((data && data.detail) || raw || "close group failed");
            await loadGroups();
            $("runStatus").textContent = `Closed group ${groupId.slice(0, 8)}.`;
          } catch (err) {
            $("runStatus").textContent = `Close error: ${err.message}`;
          }
          return;
        }

        const selectBtn = event.target.closest("[data-select-group]");
        if (selectBtn) {
          const groupId = selectBtn.getAttribute("data-select-group");
          if (!groupId) return;
          await activateGroup(groupId);
        }
      });

      $("csvBtn").addEventListener("click", () => {
        if (!state.modelId) return;
        window.open(`/api/models/${state.modelId}/export.csv`, "_blank");
      });

      $("mdBtn").addEventListener("click", () => {
        if (!state.modelId) return;
        window.open(`/api/models/${state.modelId}/export.md`, "_blank");
      });
    </script>
  </body>
</html>
